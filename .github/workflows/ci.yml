# ## CI/CD: workflow tu dong kiem tra Maven khi push hoac tao pull request.
name: Java CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test-and-package:
    # ## CI/CD: chay tren Ubuntu giong moi truong GitHub Actions cua nhom.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ## CI/CD: cai JDK 25 de khop voi source/target 25 trong module Clients va Server.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # ## CI/CD: build va chay toan bo JUnit test cua Common, Clients, Server.
      - name: Run unit tests
        run: mvn -B clean test

      # ## CI/CD: dong goi client/server sau khi test xanh, bo qua test de tranh chay lap lai.
      - name: Package applications
        run: mvn -B -DskipTests package
