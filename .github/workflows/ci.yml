name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build and run JUnit tests
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload packaged jars
        uses: actions/upload-artifact@v4
        with:
          name: auction-system-jars
          if-no-files-found: error
          retention-days: 7
          path: |
            Common/target/*.jar
            Clients/target/*.jar
            Server/target/*.jar
            !**/original-*.jar
